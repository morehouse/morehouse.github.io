{{ define "main" }}
<article class="wrap post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- with .Description }}
    <p class="post-description">{{ . }}</p>
    {{- end }}
    {{ partial "post-meta.html" . }}
  </header>
  {{- with .Params.featured_image }}
  <img class="post-feature" src="{{ (printf "images/%s" .) | relURL }}" alt="">
  {{- end }}
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    {{- with .GetTerms "tags" }}
    <ul class="tag-list">
      {{- range . }}
      <li><a href="{{ .RelPermalink }}">{{ .Page.Data.Term }}</a></li>
      {{- end }}
    </ul>
    {{- end }}
  </footer>
</article>
{{ end }}
