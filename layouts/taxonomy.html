{{ define "main" }}
<div class="wrap">
  <h1 class="page-title">Tags</h1>
  <ul class="tag-index">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Term }}</a>
      <span class="tag-count">{{ .Count }}</span>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
